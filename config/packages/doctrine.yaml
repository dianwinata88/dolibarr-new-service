doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        # IMPORTANT: server_version is set via the DATABASE_URL env var (see .env file)
        profiling_collect_backtrace: '%kernel.debug%'
        # Upstream llx_societe.geopoint / llx_socpeople.geopoint are MariaDB
        # spatial POINT columns, which DBAL has no native type for. A custom
        # type keeps the real `point` DDL and lets introspection work.
        types:
            point: App\DBAL\PointType
            tinyint: App\DBAL\TinyIntType
        mapping_types:
            point: point
            tinyint: tinyint
    orm:
        validate_xml_mapping: true
        # Keep Dolibarr column names verbatim (llx_ tables are snake_case upstream)
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src'
                prefix: 'App'
                alias: App

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
